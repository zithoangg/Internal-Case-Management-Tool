<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Internal Case Management</title>
  <link rel="icon" href="favicon.ico" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">

  <!-- Date picker (Air Datepicker — self-hosted so it works on CDN-blocked networks) -->
  <link rel="stylesheet" href="vendor/air-datepicker.css">

  <!-- Compiled Tailwind + custom theme -->
  <link rel="stylesheet" href="app.css">
</head>
<body class="px-4 pb-16 sm:px-6">

  <!-- ══ Header ══ -->
  <header class="mx-auto mt-6 max-w-3xl">
    <div class="relative overflow-hidden rounded-2xl px-8 py-6 text-center shadow-xl"
         style="background:linear-gradient(135deg,var(--color-brand-500),var(--color-brand-600) 50%,var(--color-brand-700));">
      <div class="pointer-events-none absolute -right-10 -top-20 h-52 w-52 rounded-full bg-white/5"></div>
      <div class="pointer-events-none absolute -bottom-12 left-8 h-32 w-32 rounded-full bg-white/5"></div>
      <h1 class="relative text-2xl font-extrabold tracking-tight text-white drop-shadow sm:text-3xl">
        Internal Case Management
      </h1>
    </div>
  </header>

  <!-- ══ Cards ══ -->
  <main class="mx-auto mt-7 grid max-w-3xl grid-cols-1 gap-6">

    <!-- ── Title Generator ── -->
    <section class="card" aria-labelledby="title-heading">
      <h2 id="title-heading" class="section-title">Title Generator</h2>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label class="label" for="nextContactDate">Next contact date</label>
          <input id="nextContactDate" type="text" class="field date-like" placeholder="Select date" autocomplete="off" readonly />
        </div>
        <div>
          <label class="label" for="serviceLevel">Service level</label>
          <select id="serviceLevel" class="field" aria-label="Service level"></select>
        </div>
        <div>
          <label class="label" for="pcy">PCY</label>
          <select id="pcy" class="field" aria-label="PCY"></select>
        </div>
        <div>
          <label class="label" for="nextActionTitle">Next action</label>
          <input id="nextActionTitle" type="text" class="field" placeholder="e.g., Follow-up email with logs" />
        </div>
        <div class="sm:col-span-2">
          <label class="label" for="icmLinked">ICM linked (optional)</label>
          <input id="icmLinked" type="text" class="field" placeholder="e.g., 1234567" />
        </div>
      </div>

      <div class="mt-5 flex flex-wrap gap-3">
        <button id="copyTitle" class="btn btn-primary">Copy</button>
        <button id="clearTitle" class="btn btn-ghost">Clear</button>
      </div>
      <div id="titleOutput" class="output-box font-mono" data-placeholder="Generated title appears here…"></div>
    </section>

    <!-- ── Case Note ── -->
    <section class="card" aria-labelledby="case-heading">
      <h2 id="case-heading" class="section-title">Case Note</h2>

      <label class="label" for="issueDescription">Issue description</label>
      <textarea id="issueDescription" class="field" placeholder="e.g., VM fails to start with error 'XYZ' when scaling"></textarea>

      <div class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label class="label" for="icmNeeded">ICM needed</label>
          <input id="icmNeeded" type="text" class="field" placeholder="Yes / No / Partial" />
        </div>
        <div>
          <label class="label" for="nextContactCase">Next contact (example)</label>
          <input id="nextContactCase" type="text" class="field" placeholder="e.g., 2025-10-21 - phone" />
        </div>
      </div>

      <label class="label mt-4" for="troubleshootingDone">Troubleshooting done</label>
      <textarea id="troubleshootingDone" class="field" placeholder="Steps taken, tools used, commands run"></textarea>

      <label class="label mt-4" for="communicationTimeline">Communication / Timeline</label>
      <textarea id="communicationTimeline" class="field" placeholder="e.g., Customer contacted at 09:00 UTC, awaiting logs"></textarea>

      <label class="label mt-4" for="nextActionCase">Next action</label>
      <input id="nextActionCase" type="text" class="field" placeholder="e.g., Scheduled meeting with customer" />

      <div class="mt-5 flex flex-wrap gap-3">
        <button id="copyCaseNote" class="btn btn-primary">Copy</button>
        <button id="clearCase" class="btn btn-ghost">Clear</button>
      </div>
      <div id="caseNoteOutput" class="output-box" aria-live="polite" data-placeholder="Generated case note appears here…" contenteditable="true"></div>
    </section>

    <!-- ── Risk Note ── -->
    <section class="card" aria-labelledby="risk-heading">
      <h2 id="risk-heading" class="section-title">Risk Note</h2>
      <p class="mb-3 text-sm text-slate-500">Tap <span class="font-semibold text-flag">Y</span> / N for each risk. <span class="font-semibold text-flag">Y</span> flags the row.</p>

      <!-- Rows are rendered from the single source of truth in script.js -->
      <div id="riskTable" class="flex flex-col gap-1.5" role="list"></div>

      <div class="mt-5 flex flex-wrap gap-3">
        <button id="copyRiskNote" class="btn btn-primary">Copy</button>
        <button id="clearRisk" class="btn btn-ghost">Clear</button>
      </div>
      <div id="riskNoteOutput" class="output-box overflow-x-auto" aria-live="polite" data-placeholder="Generated risk note appears here…" contenteditable="true"></div>
    </section>

    <!-- ── SOAP Note ── -->
    <section class="card" aria-labelledby="soap-heading">
      <h2 id="soap-heading" class="section-title">SOAP Note</h2>

      <h3 class="sub-title">S – Subjective / Issue Description</h3>
      <textarea id="soapSubject" class="field" placeholder="SUMMARY — What is the customer experiencing?"></textarea>

      <h3 class="sub-title">O – Objective / Environment</h3>
      <textarea id="soapObjective" class="field" placeholder="OBJECTIVE — What is the goal? What are we going to do?"></textarea>

      <div class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label class="label" for="soapSubscriptionId">Subscription ID</label>
          <input id="soapSubscriptionId" type="text" class="field" placeholder="e.g., xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" data-validate="guid" />
          <small id="soapSubscriptionId-hint" class="field-hint" aria-live="polite"></small>
        </div>
        <div>
          <label class="label" for="soapResourceId">Affected Resource ID</label>
          <input id="soapResourceId" type="text" class="field" placeholder="e.g., /subscriptions/.../resourceGroups/..." data-validate="resourceId" />
          <small id="soapResourceId-hint" class="field-hint" aria-live="polite"></small>
        </div>
        <div class="sm:col-span-2">
          <label class="label" for="soapDate">Timeframe of observation</label>
          <div class="dt-field">
            <input id="soapDate" type="text" class="field date-like js-nostore" placeholder="Select date &amp; time" autocomplete="off" readonly aria-haspopup="dialog" aria-expanded="false" />
            <div id="soapDtPopover" class="dt-popover" role="dialog" aria-label="Select date and time">
              <div id="soapCal" class="dt-cal"></div>
              <div id="soapTimes" class="dt-times" role="listbox" aria-label="Time"></div>
            </div>
          </div>
          <input id="soapTimeframe" type="hidden" />
          <small class="mt-1 block text-xs text-slate-500">Pick a date, then a time</small>
        </div>
        <div>
          <label class="label" for="soapIsFqr">Is FQR sent</label>
          <select id="soapIsFqr" class="field">
            <option value="">--select--</option>
            <option value="Y">Y</option>
            <option value="N">N</option>
            <option value="N/A">N/A</option>
          </select>
        </div>
        <div>
          <label class="label" for="soapPossibleFdr">Possible FDR</label>
          <select id="soapPossibleFdr" class="field">
            <option value="">--select--</option>
            <option value="Y">Y</option>
            <option value="N">N</option>
            <option value="N/A">N/A</option>
          </select>
        </div>
        <div>
          <label class="label" for="soapFdrExplain">If FDR not met / explanation</label>
          <input id="soapFdrExplain" type="text" class="field" placeholder="e.g., Customer unavailable to confirm FDR" />
        </div>
        <div>
          <label class="label" for="soapAscViewed">Has ASC been viewed/used</label>
          <select id="soapAscViewed" class="field">
            <option value="">--select--</option>
            <option value="Y">Y</option>
            <option value="N">N</option>
            <option value="N/A">N/A</option>
          </select>
        </div>
        <div>
          <label class="label" for="soapAscInsights">Any insights generated in ASC</label>
          <select id="soapAscInsights" class="field">
            <option value="">--select--</option>
            <option value="Y">Y</option>
            <option value="N">N</option>
            <option value="N/A">N/A</option>
          </select>
        </div>
        <div class="sm:col-span-2">
          <label class="label" for="soapAscDetails">ASC insights (if any)</label>
          <textarea id="soapAscDetails" class="field" placeholder="Paste ASC insights or short summary"></textarea>
        </div>
      </div>

      <h3 class="sub-title">A – Analysis</h3>
      <label class="label" for="soapAssessment">Analysis / Findings</label>
      <textarea id="soapAssessment" class="field" placeholder="ANALYSIS — What did we do? Verbose notes + env data + screenshots"></textarea>

      <h3 class="sub-title">P – Plan</h3>
      <label class="label" for="soapPlan">Outline action plan</label>
      <textarea id="soapPlan" class="field" placeholder="PLAN — Next customer action"></textarea>

      <div class="mt-5 flex flex-wrap gap-3">
        <button id="copySOAPNote" class="btn btn-primary">Copy</button>
        <button id="clearSoap" class="btn btn-ghost">Clear</button>
      </div>
      <div id="soapOutput" class="output-box min-h-56" aria-live="polite" data-placeholder="Generated SOAP note appears here…" contenteditable="true"></div>
    </section>
  </main>

  <footer class="mx-auto mt-8 max-w-3xl text-center text-sm text-slate-500/70">
    Credit: Robert Van
  </footer>

  <!-- Toast container -->
  <div id="toasts" class="pointer-events-none fixed bottom-5 right-5 z-[100000] flex flex-col items-end gap-2"></div>

  <!-- Self-hosted date picker (UMD → window.AirDatepicker) -->
  <script src="vendor/air-datepicker.js"></script>
  <!-- App logic -->
  <script src="script.js" defer></script>
</body>
</html>
